name: Terraform Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "freshbox-ep1/infra/**"
  pull_request:
    branches: [main]
    paths:
      - "freshbox-ep1/infra/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Ejecutar terraform apply (false = solo plan)"
        required: false
        default: "true"

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: freshbox-ep1/infra/envs/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform Fmt (formato)
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test (plan-only)
        run: terraform test -verbose

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_pass=${{ secrets.DB_PASS }}" \
            -var="db_root_pass=${{ secrets.DB_ROOT_PASS }}" \
            -out=tfplan

      - name: Aserciones del Plan (test de diseño)
        run: python3 ../../../tests/terraform_plan_check.py tfplan

      - name: Terraform Apply
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
        run: terraform apply -auto-approve tfplan
