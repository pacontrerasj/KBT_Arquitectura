name: Deploy Containers to EC2

on:
  workflow_run:
    workflows: ["Build & Push to ECR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA de las imágenes en ECR (deja vacío para usar el último push)"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy via SSM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy containers to EC2 instances
        working-directory: freshbox-ep1/scripts
        env:
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: bash deploy-ec2.sh